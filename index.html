<!doctype html>
<html lang="pt-BR">
  <head>
    <!-- Básico -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050208" />
    <meta name="color-scheme" content="dark" />
    <meta name="application-name" content="ALLIED" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- SEO -->
    <title>ALLIED | Organização e Comunidade Multi-jogo PT-BR</title>

    <meta
      name="description"
      content="A ALLIED é uma organização e comunidade multi-jogo brasileira focada em presença, interação e competição. Conheça as divisões Chuva, Sangue, Abismo e Eclipse e entre para a comunidade oficial."
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <meta
      name="googlebot"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <link
      rel="canonical"
      href="https://alliedgkrn.pages.dev/"
    />

    <!-- Ícone -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/leadership/allied-icon.svg"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/images/leadership/allied-icon-32.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png"
    />

    <!-- Open Graph / Discord / Facebook / WhatsApp -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:locale"
      content="pt_BR"
    />

    <meta
      property="og:site_name"
      content="ALLIED"
    />

    <meta
      property="og:title"
      content="ALLIED | Organização e Comunidade Multi-jogo"
    />

    <meta
      property="og:description"
      content="Uma organização multi-jogo brasileira construída sobre presença, interação, competição e identidade. Explore as divisões da ALLIED e conheça a comunidade oficial."
    />

    <meta
      property="og:url"
      content="https://alliedgkrn.pages.dev/"
    />

    <meta
      property="og:image"
      content="https://alliedgkrn.pages.dev/allied-share.png"
    />

    <meta
      property="og:image:secure_url"
      content="https://alliedgkrn.pages.dev/allied-share.png"
    />

    <meta
      property="og:image:type"
      content="image/png"
    />

    <meta
      property="og:image:width"
      content="1200"
    />

    <meta
      property="og:image:height"
      content="630"
    />

    <meta
      property="og:image:alt"
      content="ALLIED — organização e comunidade multi-jogo"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="ALLIED | Organização e Comunidade Multi-jogo"
    />

    <meta
      name="twitter:description"
      content="Presença, interação, competição e identidade. Conheça a ALLIED e suas divisões."
    />

    <meta
      name="twitter:image"
      content="https://alliedgkrn.pages.dev/allied-share.png"
    />

    <meta
      name="twitter:image:alt"
      content="ALLIED — organização e comunidade multi-jogo"
    />

    <!-- Dados estruturados para mecanismos de busca -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://alliedgkrn.pages.dev/#organization",
            "name": "ALLIED",
            "url": "https://alliedgkrn.pages.dev/",
            "logo": "https://alliedgkrn.pages.dev/allied-icon.svg",
            "image": "https://alliedgkrn.pages.dev/allied-share.png",
            "description": "Organização e comunidade multi-jogo brasileira focada em presença, interação, competição e identidade.",
            "foundingLocation": {
              "@type": "Country",
              "name": "Brasil"
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://alliedgkrn.pages.dev/#website",
            "url": "https://alliedgkrn.pages.dev/",
            "name": "ALLIED",
            "description": "Site oficial da ALLIED, organização e comunidade multi-jogo brasileira.",
            "inLanguage": "pt-BR",
            "publisher": {
              "@id": "https://alliedgkrn.pages.dev/#organization"
            }
          }
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <!-- Fallback para quem estiver sem JavaScript -->
    <noscript>
      <div
        style="
          min-height: 100vh;
          display: grid;
          place-items: center;
          padding: 32px;
          background: #050208;
          color: #f3ecec;
          font-family: Arial, Helvetica, sans-serif;
          text-align: center;
        "
      >
        <div style="max-width: 720px;">
          <h1 style="margin-bottom: 12px;">ALLIED</h1>

          <p style="line-height: 1.6; opacity: 0.85;">
            A ALLIED é uma organização e comunidade multi-jogo brasileira
            focada em presença, interação, competição e identidade.
          </p>

          <p style="line-height: 1.6; opacity: 0.7;">
            Ative o JavaScript para acessar a experiência completa do site.
          </p>
        </div>
      </div>
    </noscript>

    <!-- Entrada do aplicativo Vite -->
    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
